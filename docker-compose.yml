version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    restart: always

  data-service:
    build: 
      context: .
      dockerfile: services/data/Dockerfile
    volumes:
      - ./data_lake:/app/data
    ports:
      - "50051:50051" # gRPC port
      - "8001:8001"   # REST API
    restart: unless-stopped

  chart-service:
    build:
      context: .
      dockerfile: services/chart/Dockerfile
    ports:
      - "50052:50052" # gRPC port
    restart: unless-stopped

  vision-service:
    build:
      context: .
      dockerfile: services/vision/Dockerfile
    environment:
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    ports:
      - "50053:50053" # gRPC port
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  training-service:
    build:
      context: .
      dockerfile: services/training/Dockerfile
    depends_on:
      - redis
      - vision-service
      - chart-service
      - data-service
    ports:
      - "8002:8002"   # REST API
    restart: unless-stopped

  inference-service:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    ports:
      - "8000:8000"   # REST API
    depends_on:
      - redis
      - vision-service
      - chart-service
      - data-service
    restart: unless-stopped

  backtest-service:
    build:
      context: .
      dockerfile: services/backtest/Dockerfile
    ports:
      - "8003:8003"   # REST API
    restart: unless-stopped

  ui-service:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - redis
    restart: unless-stopped
