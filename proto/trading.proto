syntax = "proto3";

package trading;

// Data Service
service DataService {
  rpc GetSlidingWindow (SlidingWindowRequest) returns (OHLCVMatrix);
}

// Chart Service
service ChartService {
  rpc GenerateChart (OHLCVMatrix) returns (ChartImage);
}

// Vision Service
service VisionService {
  rpc ExtractFeatures (ChartImage) returns (FeatureVector);
}

message SlidingWindowRequest {
  string symbol = 1;
  string end_timestamp = 2; // ISO8601 string or Unix timestamp format
  int32 window_size = 3;    // e.g., 1000
}

message OHLCVMatrix {
  repeated float open = 1;
  repeated float high = 2;
  repeated float low = 3;
  repeated float close = 4;
  repeated float volume = 5;
}

message ChartImage {
  bytes image_data = 1;     // Compressed PNG or raw tensor bytes
  int32 width = 2;
  int32 height = 3;
}

message FeatureVector {
  repeated float features = 1;
}
